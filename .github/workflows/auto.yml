name: Auto Pluto Update

on:
  schedule:
    # 1. CHANGED: Swapped from hourly (0 * * * *) to daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
# 2. ADDED: Grants write permission so GitHub Actions can push files back to your repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: node index.js

      - name: Commit files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 3. ADDED: Forces a localized repository file update so an active commit happens every day
          echo "Last active automated run: $(date -u)" > heartbeat.txt
          
          git add .
          
          # 4. CHANGED: Added '[skip ci]' so your heartbeat push won't accidentally trigger a double run
          git commit -m "Auto update playlist & heartbeat [skip ci]" || echo "No changes"
          git push --force
